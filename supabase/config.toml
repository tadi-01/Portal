project_id = "fieldnotes-student-portal"

[api]
enabled = true
schemas = ["public", "graphql_public", "fieldnotes"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
enable_signup = false

[auth.email]
# This CLI field controls the email/password provider itself. Keep it enabled;
# auth.enable_signup=false above blocks public account creation globally.
enable_signup = true
enable_confirmations = true

[functions.student-login]
verify_jwt = false
